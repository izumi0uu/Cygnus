name: Repo Guard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  UV_VERSION: '0.9.11'

jobs:
  pr-shape:
    name: PR shape
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate PR title, body, and branch
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: python scripts/repo_guard.py validate-pr

  repo-quality:
    name: Repo quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-trixie@sha256:c8483555ce48101872f888c1df8a895ff689d6c7c7a5f7ac266475f9dfe89e0b
        env:
          POSTGRES_DB: cygnus_gate
          POSTGRES_USER: cygnus
          POSTGRES_PASSWORD: cygnus_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cygnus -d cygnus_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CYGNUS_GOVERNANCE_TEST_DATABASE_URL: postgresql+asyncpg://cygnus:cygnus_gate@127.0.0.1:5432/cygnus_governance_test
      CYGNUS_MIGRATION_TEST_DATABASE_URL: postgresql+asyncpg://cygnus:cygnus_gate@127.0.0.1:5432/cygnus_migration_test
      CYGNUS_WIKI_IDENTITY_TEST_DATABASE_URL: postgresql+asyncpg://cygnus:cygnus_gate@127.0.0.1:5432/cygnus_wiki_identity_test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --all-extras
      - name: Prepare isolated Postgres test databases
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U cygnus cygnus_governance_test
          docker exec "${{ job.services.postgres.id }}" createdb -U cygnus cygnus_migration_test
          docker exec "${{ job.services.postgres.id }}" createdb -U cygnus cygnus_wiki_identity_test
          DATABASE_URL="$CYGNUS_GOVERNANCE_TEST_DATABASE_URL" uv run alembic upgrade head
          DATABASE_URL="$CYGNUS_WIKI_IDENTITY_TEST_DATABASE_URL" uv run alembic upgrade head

      - name: Run local repo checks
        run: bash scripts/repo_check.sh

  commit-shape:
    name: Commit shape
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate commit messages in PR range
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/repo_guard.py validate-commit-range "$PR_BASE_SHA" "$PR_HEAD_SHA"
