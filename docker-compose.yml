# DEVELOPMENT ONLY — this build/mount/default-credential profile is never a production deployment.
# Production operators MUST use deploy/docker-compose.prod.yml with digest-pinned
# release metadata and externally supplied secrets/TLS material.

x-cygnus-runtime: &cygnus-runtime
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - path: ./.env.docker.example
      required: true
    - path: ./.env.docker.local
      required: false

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-trixie@sha256:c8483555ce48101872f888c1df8a895ff689d6c7c7a5f7ac266475f9dfe89e0b
    restart: unless-stopped
    environment:
      POSTGRES_DB: cygnus
      POSTGRES_USER: cygnus
      POSTGRES_PASSWORD: cygnus_secret
    ports:
      - "${CYGNUS_DOCKER_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine3.21@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    environment:
      # Password is mandatory; keep in sync with redis_password in
      # .env.docker.example (default: cygnus_redis_secret).
      REDIS_PASSWORD: ${CYGNUS_DOCKER_REDIS_PASSWORD:-cygnus_redis_secret}
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    ports:
      # Loopback-only by default: never publish the queue to the LAN.
      - "${CYGNUS_DOCKER_REDIS_HOST_PORT:-127.0.0.1:6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    ports:
      - "${CYGNUS_DOCKER_MINIO_API_HOST_PORT:-9000}:9000"
      - "${CYGNUS_DOCKER_MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  migrator:
    <<: *cygnus-runtime
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    command: ["python", "-m", "cygnus.runtime.bootstrap.init_local_stack"]
    restart: "no"

  api:
    <<: *cygnus-runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    command: ["uvicorn", "cygnus.runtime.main:app", "--host", "0.0.0.0", "--port", "8077"]
    ports:
      - "${CYGNUS_DOCKER_API_HOST_PORT:-8077}:8077"
    # Gate "healthy" on full readiness (DB + exact Alembic head, Redis, MinIO,
    # config, fresh heartbeats from BOTH workers). /health stays for compatibility.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8077/readyz', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    <<: *cygnus-runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    # Graceful drain runner: SIGTERM publishes a draining heartbeat, stops
    # claiming jobs, waits WORKER_DRAIN_GRACE_SECONDS (default 30) for
    # in-flight work, then closes resources. stop_grace_period must stay
    # above the drain grace so SIGKILL never truncates the drain.
    command: ["python", "-m", "cygnus.runtime.worker"]
    stop_grace_period: "${CYGNUS_WORKER_STOP_GRACE_SECONDS:-45}s"
    healthcheck:
      test: ["CMD", "python", "/opt/cygnus/worker_healthcheck.py", "default"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  worker-skills:
    <<: *cygnus-runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    command: ["python", "-m", "cygnus.runtime.worker", "SkillWorkerSettings"]
    stop_grace_period: "${CYGNUS_WORKER_STOP_GRACE_SECONDS:-45}s"
    healthcheck:
      test: ["CMD", "python", "/opt/cygnus/worker_healthcheck.py", "skills"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${CYGNUS_DOCKER_FRONTEND_HOST_PORT:-5173}:80"

volumes:
  postgres_data:
  redis_data:
  minio_data:
