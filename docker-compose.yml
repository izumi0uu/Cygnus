x-cygnus-runtime: &cygnus-runtime
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - path: ./.env.docker.example
      required: true
    - path: ./.env.docker.local
      required: false

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: cygnus
      POSTGRES_USER: cygnus
      POSTGRES_PASSWORD: cygnus_secret
    ports:
      - "${CYGNUS_DOCKER_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${CYGNUS_DOCKER_REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    ports:
      - "${CYGNUS_DOCKER_MINIO_API_HOST_PORT:-9000}:9000"
      - "${CYGNUS_DOCKER_MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  migrator:
    <<: *cygnus-runtime
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    command: ["python", "-m", "cygnus.runtime.bootstrap.init_local_stack"]
    restart: "no"

  api:
    <<: *cygnus-runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    command: ["uvicorn", "cygnus.runtime.main:app", "--host", "0.0.0.0", "--port", "8077"]
    ports:
      - "${CYGNUS_DOCKER_API_HOST_PORT:-8077}:8077"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8077/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    <<: *cygnus-runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    command: ["arq", "cygnus.runtime.worker.WorkerSettings"]

  worker-skills:
    <<: *cygnus-runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    command: ["arq", "cygnus.runtime.worker.SkillWorkerSettings"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${CYGNUS_DOCKER_FRONTEND_HOST_PORT:-5173}:80"

volumes:
  postgres_data:
  redis_data:
  minio_data:
