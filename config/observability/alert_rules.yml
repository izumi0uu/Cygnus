      - alert: ALERT-142-INGESTION-P50_MS
        expr: cygnus_capacity_gate_breach{route="ingestion",metric="p50_ms",approval_ref!~"unknown|redacted",thresholds_ref!~"unknown|redacted",targets_ref!~"unknown|redacted",thresholds_fingerprint!~"unknown|redacted"} == 1
