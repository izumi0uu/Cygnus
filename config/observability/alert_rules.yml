      - alert: ALERT-142-INGESTION-THROUGHPUT_RPS
        expr: cygnus_capacity_gate_breach{route="ingestion",metric="throughput_rps",approval_ref!~"unknown|redacted",thresholds_ref!~"unknown|redacted",targets_ref!~"unknown|redacted",thresholds_fingerprint!~"unknown|redacted"} == 1
