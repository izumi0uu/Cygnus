      - alert: ALERT-142-TICKET_IMPORT-P95_MS
        expr: cygnus_capacity_gate_breach{route="ticket_import",metric="p95_ms",approval_ref!~"unknown|redacted",thresholds_ref!~"unknown|redacted",targets_ref!~"unknown|redacted",thresholds_fingerprint!~"unknown|redacted"} == 1
        for: 1m
