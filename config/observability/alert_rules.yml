        expr: cygnus_capacity_gate_breach{route="ticket_import",metric="denial_rate",approval_ref!~"unknown|redacted",thresholds_ref!~"unknown|redacted",targets_ref!~"unknown|redacted",thresholds_fingerprint!~"unknown|redacted"} == 1
        for: 1m
