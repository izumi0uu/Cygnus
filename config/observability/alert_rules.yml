        annotations: *capacity_annotations
      - alert: ALERT-142-TICKET_IMPORT-P99_MS
        expr: cygnus_capacity_gate_breach{route="ticket_import",metric="p99_ms",approval_ref!~"unknown|redacted",thresholds_ref!~"unknown|redacted",targets_ref!~"unknown|redacted",thresholds_fingerprint!~"unknown|redacted"} == 1
        for: 1m
        labels: *capacity_labels
        annotations: *capacity_annotations
      - alert: ALERT-142-TICKET_IMPORT-THROUGHPUT_RPS
        expr: cygnus_capacity_gate_breach{route="ticket_import",metric="throughput_rps",approval_ref!~"unknown|redacted",thresholds_ref!~"unknown|redacted",targets_ref!~"unknown|redacted",thresholds_fingerprint!~"unknown|redacted"} == 1
