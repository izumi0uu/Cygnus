# Cygnus Production V1 manifest (CYG-131 / CYG-134)
#
# This is not a local development profile: no build context, source mounts,
# development credentials, or host-published service ports exist here. The
# reverse proxy is the only ingress. Missing release, secret, TLS, metric
# allowlist, or resource input fails before a rollout; nothing has a fake prod
# default. Use scripts/prod/deploy.sh rather than bare `docker compose up`.

name: cygnus-prod

x-backend-app: &backend-app
  image: ${CYGNUS_API_IMAGE:?CYGNUS_API_IMAGE required - use deploy/releases/<version>.env}
  env_file:
    - path: .env.prod
      required: true
  init: true
  restart: unless-stopped
  networks: [prodnet]
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=128m
  user: "65534:65534"
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  deploy:
    resources:
      limits:
        cpus: "${CYGNUS_APP_CPU_LIMIT:?CYGNUS_APP_CPU_LIMIT required in deploy/.env.prod}"
        memory: "${CYGNUS_APP_MEMORY_LIMIT:?CYGNUS_APP_MEMORY_LIMIT required in deploy/.env.prod}"
  pids_limit: 256
  environment:
    HOME: /tmp
    TIKTOKEN_CACHE_DIR: /tmp/tiktoken
    PYTHONDONTWRITEBYTECODE: "1"
    APP_ENVIRONMENT: "production"
    ENVIRONMENT: "production"
    APP_RELEASE: ${APP_RELEASE:?APP_RELEASE required in deploy/releases/<version>.env}
    APP_COMMIT_SHA: ${APP_COMMIT_SHA:?APP_COMMIT_SHA required in deploy/releases/<version>.env}
    APP_IMAGE_REF: ${CYGNUS_API_IMAGE:?}
    APP_DEPLOYMENT_ID: ${APP_DEPLOYMENT_ID:?APP_DEPLOYMENT_ID required in deploy/.env.prod or generated by deploy.sh}
    EXPECTED_ALEMBIC_HEAD: ${EXPECTED_ALEMBIC_HEAD:?EXPECTED_ALEMBIC_HEAD required in deploy/releases/<version>.env}

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-trixie@sha256:c8483555ce48101872f888c1df8a895ff689d6c7c7a5f7ac266475f9dfe89e0b
    restart: unless-stopped
    env_file:
      - path: .env.prod
        required: true
    networks: [prodnet]
    volumes:
      - cygnus_prod_postgres:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "${CYGNUS_POSTGRES_CPU_LIMIT:?CYGNUS_POSTGRES_CPU_LIMIT required in deploy/.env.prod}"
          memory: "${CYGNUS_POSTGRES_MEMORY_LIMIT:?CYGNUS_POSTGRES_MEMORY_LIMIT required in deploy/.env.prod}"
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # Vendor data initialization requires the image-owned writable data path.
    # This service remains private to prodnet and has no host port.

  redis:
    image: redis:7.4-alpine3.21@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    env_file:
      - path: .env.prod
        required: true
    networks: [prodnet]
    volumes:
      - cygnus_prod_redis:/data
    deploy:
      resources:
        limits:
          cpus: "${CYGNUS_REDIS_CPU_LIMIT:?CYGNUS_REDIS_CPU_LIMIT required in deploy/.env.prod}"
          memory: "${CYGNUS_REDIS_MEMORY_LIMIT:?CYGNUS_REDIS_MEMORY_LIMIT required in deploy/.env.prod}"
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    env_file:
      - path: .env.prod
        required: true
    networks: [prodnet]
    volumes:
      - cygnus_prod_minio:/data
    deploy:
      resources:
        limits:
          cpus: "${CYGNUS_MINIO_CPU_LIMIT:?CYGNUS_MINIO_CPU_LIMIT required in deploy/.env.prod}"
          memory: "${CYGNUS_MINIO_MEMORY_LIMIT:?CYGNUS_MINIO_MEMORY_LIMIT required in deploy/.env.prod}"
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrator:
    <<: *backend-app
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python -m cygnus.runtime.bootstrap.ensure_storage"]
    # The deploy wrapper runs this exact one-shot command before rollout.

  api:
    <<: *backend-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    command: ["uvicorn", "cygnus.runtime.main:app", "--host", "0.0.0.0", "--port", "8077"]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8077/readyz', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *backend-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    command: ["python", "-m", "cygnus.runtime.worker", "WorkerSettings"]
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD", "python", "/opt/cygnus/worker_healthcheck.py", "default"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s

  worker-skills:
    <<: *backend-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    command: ["python", "-m", "cygnus.runtime.worker", "SkillWorkerSettings"]
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD", "python", "/opt/cygnus/worker_healthcheck.py", "skills"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s

  # Only this non-root gateway publishes ports. It terminates TLS and proxies
  # same-origin API/OAuth/MCP/health/metrics and MinIO bucket requests.
  frontend:
    image: ${CYGNUS_FRONTEND_IMAGE:?CYGNUS_FRONTEND_IMAGE required - use deploy/releases/<version>.env}
    restart: unless-stopped
    init: true
    env_file:
      - path: .env.prod
        required: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
    secrets:
      - cygnus_tls_cert
      - cygnus_tls_key
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,nosuid,nodev,noexec,size=64m,mode=1777
      - /var/run:rw,nosuid,nodev,noexec,size=1m,mode=1777
      - /etc/nginx/conf.d:rw,nosuid,nodev,noexec,size=1m,mode=1777
      - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "${CYGNUS_FRONTEND_CPU_LIMIT:?CYGNUS_FRONTEND_CPU_LIMIT required in deploy/.env.prod}"
          memory: "${CYGNUS_FRONTEND_MEMORY_LIMIT:?CYGNUS_FRONTEND_MEMORY_LIMIT required in deploy/.env.prod}"
    pids_limit: 128
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://127.0.0.1/readyz"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s
    networks: [prodnet]

secrets:
  cygnus_tls_cert:
    file: ${CYGNUS_TLS_CERT_FILE:?CYGNUS_TLS_CERT_FILE required - external certificate path}
  cygnus_tls_key:
    file: ${CYGNUS_TLS_KEY_FILE:?CYGNUS_TLS_KEY_FILE required - external private-key path}

volumes:
  cygnus_prod_postgres:
    name: cygnus-prod-postgres
  cygnus_prod_redis:
    name: cygnus-prod-redis
  cygnus_prod_minio:
    name: cygnus-prod-minio

networks:
  prodnet:
    name: cygnus-prod-net
    ipam:
      config:
        - subnet: 172.30.0.0/24
