      - alert: ALERT-142-TICKET_IMPORT-ERROR_RATE
        expr: cygnus_capacity_gate_breach{route="ticket_import",metric="error_rate",approval_ref!~"unknown|redacted",thresholds_ref!~"unknown|redacted",targets_ref!~"unknown|redacted",thresholds_fingerprint!~"unknown|redacted"} == 1
