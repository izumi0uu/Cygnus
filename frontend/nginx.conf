server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 50m;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /health {
    proxy_pass http://api:8077/health;
  }

  location = /docs {
    proxy_pass http://api:8077/docs;
  }

  location = /redoc {
    proxy_pass http://api:8077/redoc;
  }

  location = /openapi.json {
    proxy_pass http://api:8077/openapi.json;
  }

  location ^~ /api/ {
    proxy_pass http://api:8077;
  }

  location = /api {
    proxy_pass http://api:8077;
  }

  location ^~ /oauth/ {
    proxy_pass http://api:8077;
  }

  location = /oauth {
    proxy_pass http://api:8077;
  }

  location ^~ /mcp/ {
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_pass http://api:8077;
  }

  location = /mcp {
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_pass http://api:8077;
  }

  location ^~ /.well-known/ {
    proxy_pass http://api:8077;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
