# Strict security headers for every Cygnus production response (CYG-128).
#
# nginx add_header is not inherited by locations that set their own
# add_header, so this file is included at server level AND re-included in
# every location that adds Cache-Control.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# SPA CSP. Presigned MinIO URLs must stay same-origin (MINIO_PUBLIC_ENDPOINT
# == CYGNUS_DOMAIN) or extend img-src/connect-src here.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
