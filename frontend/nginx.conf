server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 50m;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Baseline security headers for every response served by this gateway.
  # NOTE: nginx add_header inheritance — a location with its own add_header
  # directives does NOT inherit server-level ones, so the SPA location below
  # repeats the full set plus its strict CSP.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

  location = /health {
    proxy_pass http://api:8077/health;
  }

  location = /docs {
    proxy_pass http://api:8077/docs;
  }

  location = /redoc {
    proxy_pass http://api:8077/redoc;
  }

  location = /openapi.json {
    proxy_pass http://api:8077/openapi.json;
  }

  location ^~ /api/ {
    proxy_pass http://api:8077;
  }

  location = /api {
    proxy_pass http://api:8077;
  }

  location ^~ /oauth/ {
    proxy_pass http://api:8077;
  }

  location = /oauth {
    proxy_pass http://api:8077;
  }

  location ^~ /mcp/ {
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_pass http://api:8077;
  }

  location = /mcp {
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_pass http://api:8077;
  }

  location ^~ /.well-known/ {
    proxy_pass http://api:8077;
  }

  # SPA — strict CSP. script-src allows only same-origin scripts plus the
  # exact sha256 of the inline theme-preloader in index.html; if that inline
  # script changes, this hash MUST be recomputed or the app breaks.
  location / {
    try_files $uri $uri/ /index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-zjS4IAvtALHLT6eo35AGEvvdF/6CjMzT3MXb7r8PLqY='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  }
}
