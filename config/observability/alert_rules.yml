        annotations: *capacity_annotations

      - alert: ALERT-142-TICKET_IMPORT-P50_MS
        expr: cygnus_capacity_gate_breach{route="ticket_import",metric="p50_ms",approval_ref!~"unknown|redacted",thresholds_ref!~"unknown|redacted",targets_ref!~"unknown|redacted",thresholds_fingerprint!~"unknown|redacted"} == 1
