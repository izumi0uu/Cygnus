[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cygnus"
version = "0.1.0"
description = "Support-domain core for the Cygnus support knowledge operating system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "google-genai>=1.0.0",
    "openai>=1.30.0",
    "anthropic>=0.30.0",
    "fastmcp>=2.0.0",
    "bcrypt>=4.0.0",
    "pyjwt>=2.8.0",
    "pymupdf>=1.25.0",
    "python-docx>=1.1.0",
    "minio>=7.2.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.0",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "aiosmtplib>=3.0.0",
    "arq>=0.26",
    "redis[hiredis]>=5.0",
    "cryptography>=44.0",
    "mammoth>=1.12.0",
    "tiktoken>=0.8.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "tabulate>=0.9",
    "opentelemetry-api>=1.42,<2",
    "opentelemetry-sdk>=1.42,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.42,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.0",
    "mypy>=1.14.0",
    "pip-audit>=2.7.0",
]

[tool.uv]
# `uv sync` installs the `cygnus` distribution itself (not just dependencies).
package = true

[tool.setuptools.packages.find]
include = ["cygnus*"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["cygnus", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
