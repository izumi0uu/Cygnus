      - alert: ALERT-142-TICKET_IMPORT-RETRY_RATE
        expr: cygnus_capacity_gate_breach{route="ticket_import",metric="retry_rate",approval_ref!~"unknown|redacted",thresholds_ref!~"unknown|redacted",targets_ref!~"unknown|redacted",thresholds_fingerprint!~"unknown|redacted"} == 1
        for: 1m
        labels: *capacity_labels
        annotations: *capacity_annotations
      - alert: ALERT-142-TICKET_IMPORT-QUEUE_AGE_SECONDS
        expr: cygnus_capacity_gate_breach{route="ticket_import",metric="queue_age_seconds",approval_ref!~"unknown|redacted",thresholds_ref!~"unknown|redacted",targets_ref!~"unknown|redacted",thresholds_fingerprint!~"unknown|redacted"} == 1
