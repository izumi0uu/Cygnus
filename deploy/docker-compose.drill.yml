# Disposable target for scripts/prod/backup_restore_drill.sh.
# It is intentionally separate from both the production and certification
# Compose projects and publishes only loopback ports.
name: cygnus-drill
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-trixie@sha256:c8483555ce48101872f888c1df8a895ff689d6c7c7a5f7ac266475f9dfe89e0b
    environment:
      POSTGRES_USER: "${CYGNUS_DRILL_POSTGRES_USER:?CYGNUS_DRILL_POSTGRES_USER required}"
      POSTGRES_DB: "${CYGNUS_DRILL_POSTGRES_INIT_DB:-postgres}"
      POSTGRES_PASSWORD: "${CYGNUS_DRILL_POSTGRES_PASSWORD:?CYGNUS_DRILL_POSTGRES_PASSWORD required}"
    ports:
      - "127.0.0.1:${CYGNUS_DRILL_POSTGRES_PORT:-25432}:5432"
    volumes:
      - cygnus_drill_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine3.21@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: "${CYGNUS_DRILL_REDIS_PASSWORD:?CYGNUS_DRILL_REDIS_PASSWORD required}"
    ports:
      - "127.0.0.1:${CYGNUS_DRILL_REDIS_PORT:-26379}:6379"
    volumes:
      - cygnus_drill_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${CYGNUS_DRILL_MINIO_ACCESS_KEY:?CYGNUS_DRILL_MINIO_ACCESS_KEY required}"
      MINIO_ROOT_PASSWORD: "${CYGNUS_DRILL_MINIO_SECRET_KEY:?CYGNUS_DRILL_MINIO_SECRET_KEY required}"
    ports:
      - "127.0.0.1:${CYGNUS_DRILL_MINIO_PORT:-29000}:9000"
    volumes:
      - cygnus_drill_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  cygnus_drill_postgres:
    name: cygnus-drill-postgres
  cygnus_drill_redis:
    name: cygnus-drill-redis
  cygnus_drill_minio:
    name: cygnus-drill-minio
